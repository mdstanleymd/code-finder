<style>
:root{
  --purple:#33006F; --purple-grad:#5E5CAF; --green:#47A141; --green-ada:#288222;
  --orange-ada:#C85114; --blue-ada:#007BB4; --gray:#4D4D4F; --gray-60:#6B6B70;
  --gray-purple:#C1BCCD; --lite:#F1F1F4; --white:#fff; --crimson:#BB3C55;
  --font:"Museo Sans","Nunito Sans",Corbel,system-ui,-apple-system,sans-serif;
  --shadow-card:0 1px 2px #33006f14,0 2px 8px #33006f14;
  --shadow-raised:0 4px 8px #33006f14,0 12px 28px #33006f24;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;position:fixed;inset:0;width:100%}
body{background:var(--lite);color:var(--gray);font-family:var(--font);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--blue-ada);outline-offset:2px}
.mono{font-variant-numeric:tabular-nums lining-nums;letter-spacing:.01em}
svg{display:block}

/* Layout */
.app{display:grid;grid-template-columns:minmax(0,1fr);height:100%;overflow:hidden;position:relative}
.pane-list{min-width:0;display:flex;flex-direction:column;height:100%;min-height:0}
header.top{background:var(--purple);color:#fff;padding:calc(var(--sat) + 16px) 16px 30px;clip-path:polygon(0 0,100% 0,100% calc(100% - 18px),0 100%);flex:none}
.brandrow{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
h1{margin:0;font-weight:300;font-size:30px;line-height:36px;letter-spacing:-.01em}
h1 b{font-weight:800}
.sub{font-size:13px;opacity:.8}
.search{position:relative}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--gray-60)}
.search input{width:100%;height:48px;border:0;border-radius:8px;padding:0 44px 0 42px;font:inherit;font-size:17px;color:var(--gray);background:#fff;-webkit-appearance:none;appearance:none}
.search .clear{position:absolute;right:4px;top:4px;width:40px;height:40px;display:none;align-items:center;justify-content:center;color:var(--gray-60)}
.search.has .clear{display:flex}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:-6px 16px 0;background:#fff;border-radius:8px;padding:4px;box-shadow:var(--shadow-card);position:relative;z-index:1;flex:none}
.tabs button{height:40px;border-radius:6px;font-size:13.5px;font-weight:700;color:var(--gray-60)}
.tabs button[aria-selected="true"]{background:var(--purple);color:#fff}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 16px 4px;scrollbar-width:none;flex:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:34px;padding:0 14px;border-radius:999px;background:#fff;border:1px solid var(--gray-purple);font-size:14px;font-weight:600;color:var(--gray)}
.chip[aria-pressed="true"]{background:var(--purple);border-color:var(--purple);color:#fff}
.scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px 16px calc(var(--sab) + 24px)}
.count{font-size:13px;color:var(--gray-60);margin:4px 2px 8px}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border-radius:8px;padding:12px 8px 12px 14px;box-shadow:var(--shadow-card);min-height:60px}
.row:active{background:#faf9fc}
.row.on{outline:2px solid var(--purple);outline-offset:-2px}
.row .code{flex:none;width:76px;font-weight:800;color:var(--purple);font-size:16px}
.row .txt{flex:1;min-width:0}
.row .desc{font-size:15px;line-height:1.35;color:var(--gray)}
.row .meta{font-size:12px;color:var(--gray-60);margin-top:2px}
.row .chev{flex:none;color:var(--gray-purple)}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:1px 6px;border-radius:4px;background:var(--lite);color:var(--gray-60);margin-right:6px}
.tag.add{background:#E8F3E7;color:var(--green-ada)}
.tag.mine{background:#FBEDE5;color:var(--orange-ada)}
.empty{text-align:center;color:var(--gray-60);padding:40px 16px;font-size:15px}
.sec-h{font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--green-ada);margin:20px 2px 8px}

/* Detail */
.pane-detail{position:fixed;inset:0;background:var(--lite);transform:translateX(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;z-index:20;visibility:hidden}
.pane-detail.open{transform:none;visibility:visible}
.d-head{background:var(--purple);color:#fff;padding:calc(var(--sat) + 8px) 16px 34px;clip-path:polygon(0 0,100% 0,100% calc(100% - 18px),0 100%);flex:none}
.d-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.iconbtn{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:8px}
.back{display:flex;align-items:center;gap:2px;height:44px;font-weight:700;font-size:16px;padding-right:8px}
.d-kind{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.75}
.d-code{font-size:40px;line-height:46px;font-weight:300;margin:2px 0 4px;display:flex;align-items:center;gap:10px}
.d-code button{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;background:rgba(255,255,255,.14);border-radius:999px;padding:6px 12px}
.d-desc{font-size:17px;line-height:1.4;font-weight:400}
.d-body{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 16px calc(var(--sab) + 110px)}
.group{background:#fff;border-radius:8px;box-shadow:var(--shadow-card);overflow:hidden;margin-bottom:12px}
.group h3{margin:0;font-size:14px;font-weight:800;color:var(--purple);padding:12px 14px 8px;display:flex;justify-content:space-between;gap:8px}
.group h3 span{font-weight:600;color:var(--gray-60);font-size:12px}
.cpt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 8px 10px 14px;border-top:1px solid var(--lite);min-height:56px}
.cpt .ck{flex:none;width:24px;height:24px;border-radius:999px;border:2px solid var(--gray-purple);display:flex;align-items:center;justify-content:center;color:#fff}
.cpt[aria-pressed="true"] .ck{background:var(--purple);border-color:var(--purple)}
.cpt .code{flex:none;width:58px;font-weight:800;color:var(--purple)}
.cpt .desc{flex:1;font-size:14.5px;line-height:1.35}
.cpt .rv{flex:none;width:54px;text-align:right;line-height:1.1}
.cpt .rv b{display:block;font-size:16px;font-weight:800;color:var(--green-ada)}
.cpt .rv small{font-size:11px;font-weight:700;color:var(--gray-60)}
.d-rvu{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.d-rvu span{font-size:13px;font-weight:700;background:rgba(255,255,255,.14);border-radius:999px;padding:4px 10px}
.d-foot .tot{flex:none;text-align:right;line-height:1.1;padding-right:4px}
.d-foot .tot b{display:block;font-size:20px;font-weight:800;color:var(--green-ada)}
.d-foot .tot small{font-size:11px;font-weight:700;color:var(--gray-60)}
.cpt .cp{flex:none;width:40px;height:40px;display:flex;align-items:center;justify-content:center;color:var(--gray-60);border-radius:8px}
.assist{background:#fff;border-radius:8px;box-shadow:var(--shadow-card);margin-bottom:12px;overflow:hidden;border-top:4px solid var(--green-ada)}
.assist.idle{border-top-color:var(--gray-purple)}
.as-h{display:flex;align-items:center;gap:8px;padding:12px 14px 8px;color:var(--purple)}
.as-h b{font-size:15px;font-weight:800}
.as-h span{margin-left:auto;font-size:12px;font-weight:700;color:var(--gray-60)}
.as-empty{padding:0 14px 14px;font-size:14px;color:var(--gray-60)}
.as-warn{display:flex;gap:10px;padding:10px 14px;border-top:1px solid var(--lite);font-size:13.5px;line-height:1.4}
.as-warn svg{flex:none;margin-top:1px}
.as-warn b{font-size:13px}
.as-warn.stop{background:#FBF0F2}.as-warn.stop svg,.as-warn.stop b{color:var(--crimson)}
.as-warn.warn{background:#FDF5EF}.as-warn.warn svg,.as-warn.warn b{color:var(--orange-ada)}
.as-rec{display:flex;align-items:center;gap:10px;padding:12px 14px;border-top:1px solid var(--lite)}
.as-main{flex:1;min-width:0}
.as-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.as-code{font-weight:800;color:var(--purple);font-size:16px}
.as-lvl{font-size:11px;font-weight:800;padding:2px 7px;border-radius:999px}
.as-lvl.likely{background:#E8F3E7;color:var(--green-ada)}
.as-lvl.if{background:var(--lite);color:var(--gray-60)}
.as-w{margin-left:auto;font-size:13px;font-weight:800;color:var(--green-ada)}
.as-d{font-size:14px;line-height:1.35;margin-top:2px}
.as-why{font-size:12.5px;line-height:1.4;color:var(--gray-60);margin-top:3px}
.as-add{flex:none;height:40px;padding:0 14px}
.as-tips{padding:10px 14px 12px;border-top:1px solid var(--lite);font-size:12.5px;line-height:1.45;color:var(--gray-60);background:#FAF9FC}
.as-tips div+div{margin-top:4px}
.as-badge{flex:none;position:relative;width:44px;height:44px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--purple);background:#fff;border:1.5px solid var(--gray-purple)}
.as-badge i{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;border-radius:999px;font-style:normal;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 5px;background:var(--green-ada);color:#fff}
.as-badge i.alert{background:var(--crimson)}
.as-badge i:empty{display:none}
.linkrow{display:flex;gap:8px;padding:10px 14px 14px;border-top:1px solid var(--lite)}
.linkrow input{flex:1;min-width:0;height:44px;border:1px solid var(--gray-purple);border-radius:8px;padding:0 12px;font:inherit;font-size:16px}
.btn{height:44px;padding:0 16px;border-radius:8px;font-weight:700;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--purple);color:#fff}
.btn.secondary{background:#fff;color:var(--purple);border:1.5px solid var(--purple)}
.btn.ghost{color:var(--purple)}
.btn.danger{color:var(--crimson);border:1.5px solid var(--crimson);background:#fff}
.btn:disabled{opacity:.4}
.d-foot{position:absolute;left:0;right:0;bottom:0;padding:12px 16px calc(var(--sab) + 12px);background:rgba(241,241,244,.92);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid var(--gray-purple);display:flex;gap:8px;align-items:center}
.d-foot .sum{flex:1;min-width:0;font-size:13px;color:var(--gray-60);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.d-foot .sum b{color:var(--purple)}
.note{font-size:13px;color:var(--gray-60);padding:4px 2px 12px}
.dx-row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;border-top:1px solid var(--lite);min-height:52px}
.dx-row .code{flex:none;width:72px;font-weight:800;color:var(--purple)}
.dx-row .desc{flex:1;font-size:14.5px;line-height:1.35}
.d-empty{display:none}

/* Reference */
.card{background:#fff;border-radius:8px;box-shadow:var(--shadow-card);padding:14px;margin-bottom:12px}
.card h3{margin:0 0 6px;font-size:16px;color:var(--purple);font-weight:800}
.card p{margin:0 0 10px;font-size:14px}
.kv{display:grid;grid-template-columns:64px 1fr;gap:6px 12px;font-size:14px;line-height:1.35}
.kv dt{font-weight:800;color:var(--purple)}
.kv dd{margin:0}
.btnrow{display:flex;flex-wrap:wrap;gap:8px}
details.card summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;min-height:28px}
details.card summary::-webkit-details-marker{display:none}
details.card summary h3{margin:0}
details.card[open] summary{margin-bottom:10px}
details.card summary svg{transition:transform .2s;color:var(--gray-60)}
details.card[open] summary svg{transform:rotate(90deg)}

/* Dialog */
dialog{border:0;border-radius:12px;padding:0;width:min(560px,calc(100vw - 24px));max-height:calc(100vh - 48px);box-shadow:var(--shadow-raised);color:var(--gray)}
dialog::backdrop{background:rgba(20,0,45,.45)}
.dlg{padding:18px 16px 16px}
.dlg h2{margin:0 0 12px;font-size:20px;color:var(--purple);font-weight:800}
.field{margin-bottom:12px}
.field label{display:block;font-size:14px;font-weight:700;margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;min-height:44px;border:1px solid var(--gray-purple);border-radius:8px;padding:10px 12px;font:inherit;font-size:16px;color:var(--gray);background:#fff}
.field textarea{min-height:110px;font-size:14px;font-family:ui-monospace,Menlo,monospace}
.field .hint{font-size:12px;color:var(--gray-60);margin-top:4px}
.dlg .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}
.err{color:var(--crimson);font-size:13px;min-height:18px}

/* Toast */
.toast{position:fixed;left:50%;bottom:calc(var(--sab) + 90px);transform:translate(-50%,20px);background:var(--purple);color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;font-weight:700;opacity:0;pointer-events:none;transition:all .2s;z-index:50;display:flex;align-items:center;gap:8px;box-shadow:var(--shadow-raised)}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* iPad / wide: two panes */
@media (min-width:900px){
  .app{grid-template-columns:400px minmax(0,1fr)}
  .pane-list{border-right:1px solid var(--gray-purple)}
  .pane-detail{position:relative;inset:auto;transform:none;visibility:visible;transition:none;z-index:auto;height:100%}
  .back{display:none}
  .d-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--gray-60);text-align:center;padding:32px;gap:12px}
  .pane-detail.blank .d-head,.pane-detail.blank .d-body,.pane-detail.blank .d-foot{display:none}
  .pane-detail:not(.blank) .d-empty{display:none}
  .toast{left:calc(400px + (100% - 400px)/2)}
}
</style>

    cptsFor(i).forEach(({codes,label})=>codes.forEach(code=>{const c=CPT_BY[code];if(c){if(!c.icds.includes(i.code))c.icds.push(i.code);c.cats.add(i.cat);c.groups.add(label)}}));
  });
  ICDX.forEach(i=>i.hay=norm(i.code+" "+i.code.replace(".","")+" "+i.desc+" "+i.kw+" "+CATS[i.cat]));

function cptsFor(i){
  const out=i.groups.filter(g=>GROUPS[g]).map(g=>({label:GROUPS[g][0],codes:GROUPS[g][1]}));
  const l=custom.links[i.code];
  if(l&&l.length)out.unshift({label:"My linked codes",codes:l,mine:true});
  return out;
}
function norm(s){return s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/['’]/g,"")}

/* ============== Search ============== */
function search(items,q){
  const toks=norm(q).split(/[\s,]+/).filter(Boolean);
  if(!toks.length)return items.slice();
  const res=[];
  for(const it of items){
    let s=0,ok=true;
    const code=it.code.toLowerCase(),codeN=code.replace(".","");
    for(const t of toks){
      const tN=t.replace(".","");
      if(code===t||codeN===tN)s+=200;
      else if(code.startsWith(t)||codeN.startsWith(tN))s+=120;
      else if(new RegExp("(^|[^a-z0-9])"+esc(t)).test(it.hay))s+=12;
      else if(t.length>2&&it.hay.includes(t))s+=4;
      else{ok=false;break}
    }
    if(ok)res.push([s,it]);
  }
  return res.sort((a,b)=>b[0]-a[0]).map(r=>r[1]);
}

function runEngine(picked){
  const P=new Set(picked),recs=new Map(),warns=[],tips=[];
  for(const r of SUGGEST){
    if(P.has(r.add)||!r.when.some(c=>P.has(c)))continue;
    const ex=recs.get(r.add);
    if(!ex||(ex.lvl!=="likely"&&r.lvl==="likely"))recs.set(r.add,{...r,from:r.when.filter(c=>P.has(c))});
  }
  for(const c of CONFLICT){
    let hit;
    if(c.self)hit=c.a.filter(x=>P.has(x)).length>1;
    else hit=c.a.some(x=>P.has(x))&&c.b.some(x=>P.has(x)&&!c.a.includes(x));
    if(hit)warns.push(c);
  }
  // Add-ons without a valid primary
  for(const code of P){
    const ad=ADDON[code];if(!ad)continue;
    if(ad.p==="any"){
      const prim=[...P].some(c=>c!==code&&!ADDON[c]&&!/^9/.test(c));
      if(!prim)warns.push({sev:"stop",t:"Missing primary code",msg:`+${code} is an add-on and needs a primary procedure on the same claim.`});
      continue;
    }
    if(ad.p.some(c=>P.has(c)))continue;
    if(ad.vp&&ad.vp.some(c=>P.has(c)))warns.push({sev:"warn",v:true,msg:`+${code} with ${ad.vp.filter(c=>P.has(c)).join(", ")} isn't in the original CPT parent list. Verify payer acceptance.`});
    else warns.push({sev:"stop",t:"Missing primary code",msg:`+${code} needs one of these primary codes: ${ad.p.slice(0,8).join(", ")}${ad.p.length>8?"…":""}.`});
  }
  // Tips
  const globs=[...P].map(c=>CPT_BY[c]&&CPT_BY[c].glob);
  if(globs.includes("090"))tips.push("90-day global: add modifier 57 to the E/M on the day before or day of surgery if that visit made the decision to operate. Postop visits are 99024 (0 wRVU).");
  else if(globs.some(g=>g==="000"||g==="010"))tips.push("Minor procedure (0/10-day global): a significant, separately identifiable E/M the same day takes modifier 25.");
  if(P.has("S2900"))tips.push("S2900 has no Medicare RVU. List it with the primary code; payment is payer-specific.");
  if([...P].some(c=>ANAT.includes(c)||THOR_VATS.includes(c)))tips.push("Intercostal nerve blocks or cryoablation by the operating surgeon for postop pain aren't separately billable (NCCI Ch. V H.8).");
  if([...P].filter(c=>CPT_BY[c]&&!CPT_BY[c].add&&CPT_BY[c].glob&&CPT_BY[c].glob!=="ZZZ").length>1)tips.push("Multiple primary procedures: the highest-wRVU code goes first, and others take modifier 51 (Medicare pays secondary at 50%). Add-ons are exempt.");
  const order={likely:0,if:1};
  return {recs:[...recs.values()].sort((a,b)=>order[a.lvl]-order[b.lvl]||((CPT_BY[b.add]||{}).w||0)-((CPT_BY[a.add]||{}).w||0)),warns,tips};
}

function assistHTML(){
  const p=[...S.picked];
  if(!p.length)return `<div class="assist idle"><div class="as-h">${ICON.bulb}<b>Billing assistant</b></div><div class="as-empty">Select the procedures you did. I'll suggest add-on codes that are usually billable together and flag bundling conflicts.</div></div>`;
  const {recs,warns,tips}=runEngine(p);
  let html=`<div class="assist"><div class="as-h">${ICON.bulb}<b>Billing assistant</b><span>${recs.length} suggestion${recs.length===1?"":"s"}${warns.length?` · ${warns.length} alert${warns.length===1?"":"s"}`:""}</span></div>`;
  if(warns.length)html+=warns.map(w=>`<div class="as-warn ${w.sev}">${w.sev==="stop"?ICON.stop:ICON.warn}<div><b>${w.t||(w.sev==="stop"?"Bundling conflict":"Check")}</b>${w.v?' <span class="tag mine">Verify</span>':""}<div>${h(w.msg)}</div></div></div>`).join("");
  if(recs.length)html+=recs.map(r=>{const c=CPT_BY[r.add];if(!c)return"";return `<div class="as-rec"><div class="as-main"><div class="as-top"><span class="mono as-code">${c.add?"+":""}${h(c.code)}${r.mod?`-${h(r.mod)}`:""}</span><span class="as-lvl ${r.lvl}">${r.lvl==="likely"?"Commonly billed":"If performed"}</span>${r.v?'<span class="tag mine">Verify</span>':""}<span class="as-w mono">${fw(c.w)} wRVU</span></div><div class="as-d">${h(c.desc)}</div><div class="as-why">${h(r.why)}</div></div><button class="btn secondary as-add" data-addrec="${h(c.code)}" data-mod="${h(r.mod||"")}" aria-label="Add ${h(c.code)}">Add</button></div>`}).join("");
  else if(!warns.length)html+=`<div class="as-empty">No other companion codes for this combination.</div>`;
  if(tips.length)html+=`<div class="as-tips">${tips.map(t=>`<div>• ${h(t)}</div>`).join("")}</div>`;
  return html+`</div>`;
}

function addICD(){
  dialog(`<h2>Add diagnosis</h2>
  <div class="field"><label for="f1">ICD-10 code</label><input id="f1" name="code" required autocapitalize="characters" placeholder="e.g. J93.82"></div>
  <div class="field"><label for="f2">Description</label><input id="f2" name="desc" required></div>
  <div class="field"><label for="f3">Category</label><select id="f3" name="cat">${Object.entries(CATS).map(([k,v])=>`<option value="${k}">${h(v)}</option>`).join("")}</select></div>
  <div class="field"><label for="f4">Search keywords</label><input id="f4" name="kw" placeholder="optional, e.g. air leak pal"></div>
  <div class="field"><label for="f5">Linked CPT codes</label><input id="f5" name="cpts" autocapitalize="characters" placeholder="e.g. 32650, 32655"><div class="hint">Comma-separated. Optional.</div></div>
  <div class="err"></div><div class="actions"><button class="btn ghost" value="cancel" formnovalidate>Cancel</button><button class="btn primary" value="ok">Save</button></div>`,fd=>{
    const code=fd.get("code").trim().toUpperCase(),desc=fd.get("desc").trim();
    if(!/^[A-Z][0-9][0-9A-Z](\.[0-9A-Z]{1,4})?$/.test(code))return "That doesn't look like an ICD-10 code (e.g. J93.82).";
    if(ICD_BY[code])return code+" is already in the list.";
    custom.icd.push({code,desc,cat:fd.get("cat"),kw:fd.get("kw").trim()});
    const l=parseCodes(fd.get("cpts"));if(l.length)custom.links[code]=l;
    save();build();renderList();openDetail("icd",code);toast("Added "+code);return true;
  });
}

const parseCodes=s=>(s||"").toUpperCase().split(/[\s,;]+/).map(x=>x.replace(/^\+/,"")).filter(x=>/^[0-9A-Z]{5}$/.test(x));

  const data=JSON.stringify({app:"code-finder",v:1,custom,favs},null,1);

function importData(){
  dialog(`<h2>Import backup</h2><div class="field"><label for="imp">Paste backup text</label><textarea id="imp" name="data" required></textarea><div class="hint">Merges with what's already on this device.</div></div>
  <div class="err"></div><div class="actions"><button class="btn ghost" value="cancel" formnovalidate>Cancel</button><button class="btn primary" value="ok">Import</button></div>`,fd=>{
    try{
      const o=JSON.parse(fd.get("data"));if(!o.custom)return "Not a Code Finder backup.";
      (o.custom.icd||[]).forEach(c=>{if(c&&c.code&&!custom.icd.some(x=>x.code===c.code))custom.icd.push({code:String(c.code),desc:String(c.desc||""),cat:CATS[c.cat]?c.cat:"oth",kw:String(c.kw||"")})});
      (o.custom.cpt||[]).forEach(c=>{if(c&&c.code&&!custom.cpt.some(x=>x.code===c.code))custom.cpt.push({code:String(c.code),desc:String(c.desc||""),add:!!c.add,w:(c.w==null||isNaN(Number(c.w)))?null:Number(c.w)})});
      Object.entries(o.custom.links||{}).forEach(([k,v])=>{if(Array.isArray(v))custom.links[k]=[...new Set([...(custom.links[k]||[]),...v.map(String)])]});
      (o.favs||[]).forEach(f=>{if(typeof f==="string"&&!favs.includes(f))favs.push(f)});

  });
}

    document.querySelectorAll(`[data-pick="${CSS.escape(c)}"]`).forEach(b=>{const on=S.picked.has(c);b.setAttribute("aria-pressed",on);b.querySelector(".ck").innerHTML=on?ICON.check:"";const sm=b.querySelector(".code small");if(sm&&!on)sm.remove()});refreshAssist();return}

    const sc=$("dBody").scrollTop;renderDetail();$("dBody").scrollTop=sc;toast("Added "+c+(m?"-"+m:""));return}
  if(t.dataset.unlink){const c=t.dataset.unlink,k=S.sel.code;custom.links[k]=(custom.links[k]||[]).filter(x=>x!==c);if(!custom.links[k].length)delete custom.links[k];S.picked.delete(c);save();build();renderDetail();renderList();toast("Unlinked "+c);return}
  const a=t.dataset.act;if(!a)return;
  if(a==="back"){if(history.state&&history.state.d)history.back();else closeDetail()}
  else if(a==="assist"){$("dBody").scrollTo({top:0,behavior:"smooth"})}

  else if(a==="copy-set"){const i=ICD_BY[S.sel.code];let lines=[`Dx: ${i.code} ${i.desc}`];[...S.picked].forEach(c=>{const p=CPT_BY[c];lines.push(`CPT: ${c}${S.mods[c]?"-"+S.mods[c]:""} ${p?p.desc:""}${p&&p.w!=null?` (${fw(p.w)} wRVU)`:""}`.trim())});if(S.picked.size)lines.push(`Total wRVU: ${[...S.picked].reduce((a,c)=>a+((CPT_BY[c]&&CPT_BY[c].w)||0),0).toFixed(2)}`);copyText(lines.join("\n"),S.picked.size?`Copied ${S.picked.size+1} codes`:"Copied "+i.code)}
  else if(a==="link"){const v=parseCodes($("linkIn").value);if(!v.length){toast("Enter a 5-character CPT code");return}const k=S.sel.code;
    const unknown=v.filter(c=>!CPT_BY[c]);unknown.forEach(c=>custom.cpt.push({code:c,desc:"(custom — add description in More › Add CPT)",add:false}));
    custom.links[k]=[...new Set([...(custom.links[k]||[]),...v])];save();build();renderDetail();renderList();toast("Linked "+v.join(", "))}
  else if(a==="del-icd"){const c=S.sel.code;custom.icd=custom.icd.filter(x=>x.code!==c);delete custom.links[c];favs=favs.filter(f=>f!=="icd:"+c);recent=recent.filter(x=>x!==c);save();build();S.sel=null;$("detail").classList.add("blank");closeDetail();toast("Deleted "+c)}
  else if(a==="del-cpt"){const c=S.sel.code;custom.cpt=custom.cpt.filter(x=>x.code!==c);Object.keys(custom.links).forEach(k=>{custom.links[k]=custom.links[k].filter(x=>x!==c);if(!custom.links[k].length)delete custom.links[k]});favs=favs.filter(f=>f!=="cpt:"+c);save();build();S.sel=null;$("detail").classList.add("blank");closeDetail();toast("Deleted "+c)}
  else if(a==="add-icd")addICD();
  else if(a==="add-cpt")addCPT();
  else if(a==="export")exportData();
  else if(a==="import")importData();
});
let qt;$("q").addEventListener("input",e=>{S.q=e.target.value;$("searchWrap").classList.toggle("has",!!S.q);if(S.tab==="ref"){S.tab="dx";document.querySelectorAll("[data-tab]").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab==="dx"));renderChips()}clearTimeout(qt);qt=setTimeout(()=>{renderList();$("listScroll").scrollTop=0},60)});
$("q").addEventListener("keydown",e=>{if(e.key==="Enter"){e.target.blur();const f=$("list").querySelector("[data-open]");if(f&&S.q)f.click()}});
$("clearQ").addEventListener("click",()=>{$("q").value="";S.q="";$("searchWrap").classList.remove("has");renderList();$("q").focus()});
window.addEventListener("popstate",()=>{if($("detail").classList.contains("open")&&!wide())closeDetail()});
$("linkIn")&&0;
document.addEventListener("keydown",e=>{if(e.target&&e.target.id==="linkIn"&&e.key==="Enter"){e.preventDefault();document.querySelector('[data-act="link"]').click()}});

/* Swipe right to go back (phone) */
(function(){let x0=null,y0=null;const d=$("detail");d.addEventListener("touchstart",e=>{const t=e.touches[0];if(t.clientX<40){x0=t.clientX;y0=t.clientY}else x0=null},{passive:true});d.addEventListener("touchend",e=>{if(x0===null)return;const t=e.changedTouches[0];if(t.clientX-x0>80&&Math.abs(t.clientY-y0)<60&&!wide()){if(history.state&&history.state.d)history.back();else closeDetail()}x0=null},{passive:true})})();

/* Offline cache when hosted next to sw.js (optional) */
if("serviceWorker" in navigator&&location.protocol==="https:"){navigator.serviceWorker.register("sw.js").catch(()=>{})}

build();renderChips();renderList();
</script>
